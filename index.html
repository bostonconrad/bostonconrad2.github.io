<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Polished Website</title>
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Link to our external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Decorative background glow elements -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <!-- Main glass card container -->
    <div class="glass-card">
        <header>
            <!-- Dynamic greeting populated by JavaScript -->
            <span id="greetingBadge" class="badge">Hello!</span>
            <h1>Welcome to My Space</h1>
            <p>Crafted with HTML, CSS, and JavaScript, and designed to shine.</p>
        </header>

        <main>
            <!-- Interactive Counter Section -->
            <div class="counter-box">
                <p>Interactive Counter:</p>
                <div class="counter-display">
                    <span id="counterValue">0</span>
                </div>
                <div class="button-group">
                    <button id="decreaseBtn" class="secondary-btn">Decrease</button>
                    <button id="increaseBtn" class="primary-btn">Increase</button>
                </div>
            </div>

            <!-- Fun Theme Changer Button -->
            <button id="themeToggleBtn" class="accent-btn">✨ Change Background Vibe</button>
        </main>

        <footer>
            <p>&copy; 2026 My Web Development Journey</p>
        </footer>
    </div>

    <!-- Link to our external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
